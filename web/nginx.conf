# OWLmon 웹: 정적 파일 + API 프록시
# 외부 80 → 정적은 nginx가, /api는 owlmon-server:8080으로 프록시

server {
    listen 80;
    server_name _;

    # 클라이언트 업로드 한도 (로그 ingest는 server 직접 받지만 안전 마진)
    client_max_body_size 10m;

    # gzip 압축 (정적 자산 다운로드 속도)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # API는 백엔드로 프록시
    location /api/ {
        proxy_pass http://owlmon-server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 로그 수집 등 큰 요청 대비 타임아웃 여유
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # SPA 라우팅: 정적 파일 없으면 index.html로 폴백 (React Router)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 정적 자산 캐시
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp)$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
