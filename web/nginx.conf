# OWLmon 웹: 정적 파일 + API 프록시 (HTTPS)
# 인증서: /etc/nginx/certs/cert.pem·key.pem (호스트 data/certs). 없으면 시작 시 자체 서명 인증서를 만듦
# 기관 인증서로 바꾸려면 두 파일을 덮어쓰고 owlmon-web만 재시작

# HTTP로 들어오면 HTTPS로 이동 — 로그인 비밀번호·토큰이 평문으로 오가지 않게
server {
    listen 80;
    server_name _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 보안 헤더 — 클릭재킹·MIME 스니핑 차단, 외부 스크립트 로드 금지 (외부 리소스를 쓰지 않으므로 'self'만 허용)
    # always: 4xx/5xx 응답에도 붙임. location에 add_header가 있으면 상속이 끊기므로 아래에서 다시 include
    include /etc/nginx/conf.d/security-headers.inc;
    server_tokens off;

    # 클라이언트 업로드 한도 (로그 ingest는 server 직접 받지만 안전 마진)
    client_max_body_size 10m;

    # gzip 압축 (정적 자산 다운로드 속도)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # API는 백엔드로 프록시
    location /api/ {
        proxy_pass http://owlmon-server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 로그 수집 등 큰 요청 대비 타임아웃 여유
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # SPA 라우팅: 정적 파일 없으면 index.html로 폴백 (React Router)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 정적 자산 캐시
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp)$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/security-headers.inc;
    }
}
