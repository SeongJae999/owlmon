# OWLmon 웹: 정적 파일 + API 프록시 (HTTPS)
# 인증서: /etc/nginx/certs/cert.pem·key.pem (호스트 data/certs). 없으면 시작 시 자체 서명 인증서를 만듦
# 기관 인증서로 바꾸려면 두 파일을 덮어쓰고 owlmon-web만 재시작

# 무인증 등록 토큰 교환(/api/agent/enroll)은 IP당 분당 10회(순간 20회)까지 — 대입 시도로 DB·감사 로그를 채우지 못하게.
# 8080 직접 접속은 서버가 IP당 등록 실패 횟수로 따로 막는다
limit_req_zone $binary_remote_addr zone=agent_enroll:1m rate=10r/m;

# HTTP로 들어오면 HTTPS로 이동 — 로그인 비밀번호·토큰이 평문으로 오가지 않게
server {
    listen 80;
    server_name _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

# 예전 방식 에이전트(평문 gRPC 4317)용 전환 입구 — 443과 같은 키 확인을 거친다.
# 공용 키는 서버에서 OWLMON_LEGACY_SHARED_KEY=true일 때만 통과. 모든 서버를 옮기면 docker-compose.yml에서 4317을 닫는다
server {
    listen 4317;
    http2 on;
    server_name _;
    server_tokens off;
    # 에이전트 메트릭 (OTLP gRPC) — 키를 서버에 확인받고, 키에 묶인 장비 이름을 붙여 Collector로 넘김 (443 블록과 같게 유지)
    # 에이전트가 x-owlmon-host를 직접 보내도 grpc_set_header가 덮어씀 (키 확인 결과가 비면 헤더 자체를 빼고 보냄)
    location /opentelemetry.proto.collector.metrics.v1.MetricsService/ {
        auth_request /_agent_auth;
        auth_request_set $owlmon_host $upstream_http_x_owlmon_host;
        grpc_set_header X-Owlmon-Host $owlmon_host;
        grpc_pass grpc://otel-collector:4317;
    }

    location = /_agent_auth {
        internal;
        proxy_pass http://owlmon-server:8080/api/agent/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / { return 404; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 보안 헤더 — 클릭재킹·MIME 스니핑 차단, 외부 스크립트 로드 금지 (외부 리소스를 쓰지 않으므로 'self'만 허용)
    # always: 4xx/5xx 응답에도 붙임. location에 add_header가 있으면 상속이 끊기므로 아래에서 다시 include
    include /etc/nginx/conf.d/security-headers.inc;
    server_tokens off;

    # 클라이언트 업로드 한도 (로그 ingest는 server 직접 받지만 안전 마진)
    client_max_body_size 10m;

    # gzip 압축 (정적 자산 다운로드 속도)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # 키 확인 창구는 nginx 내부(auth_request → /_agent_auth) 전용 — 밖에서 키가 맞는지 떠보지 못하게 막음
    location = /api/agent/auth { return 404; }

    location = /api/agent/enroll {
        limit_req zone=agent_enroll burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://owlmon-server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API는 백엔드로 프록시
    location /api/ {
        proxy_pass http://owlmon-server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 로그 수집 등 큰 요청 대비 타임아웃 여유
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 에이전트 메트릭 (OTLP gRPC) — 키를 서버에 확인받고, 키에 묶인 장비 이름을 붙여 Collector로 넘김 (아래 4317 블록과 같게 유지)
    # 에이전트가 x-owlmon-host를 직접 보내도 grpc_set_header가 덮어씀 (키 확인 결과가 비면 헤더 자체를 빼고 보냄)
    location /opentelemetry.proto.collector.metrics.v1.MetricsService/ {
        auth_request /_agent_auth;
        auth_request_set $owlmon_host $upstream_http_x_owlmon_host;
        grpc_set_header X-Owlmon-Host $owlmon_host;
        grpc_pass grpc://otel-collector:4317;
    }

    location = /_agent_auth {
        internal;
        proxy_pass http://owlmon-server:8080/api/agent/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA 라우팅: 정적 파일 없으면 index.html로 폴백 (React Router)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 정적 자산 캐시
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp)$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/security-headers.inc;
    }
}
