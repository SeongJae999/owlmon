name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Go: server + agent ─────────────────────────────────────────
  go:
    name: Go (server + agent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: |
            server/go.sum
            agent/go.sum

      # ─ server ─
      - name: server / go vet
        working-directory: ./server
        run: go vet ./...

      - name: server / build
        working-directory: ./server
        run: go build ./...

      - name: server / test
        working-directory: ./server
        run: go test -race -timeout 120s ./...

      # ─ agent ─
      - name: agent / go vet
        working-directory: ./agent
        run: go vet ./...

      - name: agent / build
        working-directory: ./agent
        run: go build ./...

      - name: agent / test
        working-directory: ./agent
        run: go test -race -timeout 120s ./...

  # ─── Web: React + TypeScript + Vite ─────────────────────────────
  web:
    name: Web (TypeScript + Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: install
        working-directory: ./web
        run: npm ci

      - name: type check (tsc --noEmit)
        working-directory: ./web
        run: npx tsc --noEmit

      - name: production build (vite)
        working-directory: ./web
        run: npx vite build
