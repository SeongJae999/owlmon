# OWLmon 통합 환경 (단일 호스트 배포)
# 설치: scripts/release.sh로 만든 번들의 install.sh 사용 (폐쇄망 포함). 개발 중 소스 빌드는 dev.sh
#
# 외부 노출 포트 — 이것만 연다:
#   443    웹 UI (HTTPS) — 80은 443으로 이동
#   4317   에이전트 메트릭 (OTLP gRPC, Agent Key 필요)
#   8080   에이전트 로그 수집·자동 업데이트 (API는 전부 인증 필요)
# DB(5433)·Prometheus(9090)는 이 서버 안(127.0.0.1)에서만 접근 — 사내망에 열면 인증 없이 조회됨

services:
  # 메트릭 저장소 (TSDB)
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: owlmon-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-remote-write-receiver"  # Remote Write 수신 활성화
    restart: unless-stopped

  # OpenTelemetry Collector (에이전트 → Prometheus 중계)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: owlmon-otel-collector
    ports:
      - "4317:4317"   # OTLP gRPC (에이전트, Agent Key 필요). 내부 메트릭(8888)은 열지 않음
    environment:
      - OWLMON_AGENT_KEY=${OWLMON_AGENT_KEY:-}
    volumes:
      - ./infra/otel/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    restart: unless-stopped

  # PostgreSQL (알림 히스토리, 사용자 관리)
  postgres:
    image: postgres:16-alpine
    container_name: owlmon-postgres
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      - POSTGRES_DB=owlmon
      - POSTGRES_USER=owlmon
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정하세요}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owlmon -d owlmon"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # OWLmon API 서버 (Go) — server/ 디렉토리 멀티스테이지 빌드
  owlmon-server:
    image: owlmon-server:${OWLMON_VERSION:-latest}
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: owlmon-server
    ports:
      - "8080:8080"   # 에이전트 로그 수집·자동 업데이트
    environment:
      - OWLMON_USERNAME=${OWLMON_USERNAME:-admin}
      - OWLMON_PASSWORD_HASH=${OWLMON_PASSWORD_HASH}
      - OWLMON_PROMETHEUS_URL=http://prometheus:9090
      - OWLMON_LISTEN=:8080
      - POSTGRES_DSN=postgres://owlmon:${POSTGRES_PASSWORD}@postgres:5432/owlmon?sslmode=disable
      - OWLMON_JWT_SECRET=${OWLMON_JWT_SECRET:-}
      # 에이전트 메트릭·로그 수집 공통 인증 키 (모든 에이전트 config.yaml의 agent_key와 일치해야 함)
      - OWLMON_AGENT_KEY=${OWLMON_AGENT_KEY:-}
      # 이 컨테이너에서 온 요청의 X-Real-IP만 신뢰 (8080 직접 접속으로 접속 기록 IP를 위조하지 못하게)
      - OWLMON_TRUSTED_PROXY=owlmon-web
      # SMTP (선택 — .env에 비워두면 알림 비활성)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_TO=${SMTP_TO:-}
      # LLM 통합 (옵션) — disabled / mock / openai / ollama
      #   mock:   실제 LLM 없이 가짜 응답 (UI 테스트용)
      #   openai: OPENAI_API_KEY 필요. 외부 API. 망분리 환경 불가
      #   ollama: 자체 호스팅. OWLMON_OLLAMA_URL 지정. 망분리 환경 OK
      - OWLMON_LLM_PROVIDER=${OWLMON_LLM_PROVIDER:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OWLMON_OPENAI_MODEL=${OWLMON_OPENAI_MODEL:-gpt-4o-mini}
      - OWLMON_OLLAMA_URL=${OWLMON_OLLAMA_URL:-http://host.docker.internal:11434}
      - OWLMON_OLLAMA_MODEL=${OWLMON_OLLAMA_MODEL:-gemma4:12b}
      - OWLMON_LOGINSIGHT_ENABLED=${OWLMON_LOGINSIGHT_ENABLED:-false}
    volumes:
      - ./data/owlmon-server:/app/data   # JWT secret 등 영속화
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_started
    restart: unless-stopped

  # OWLmon 웹 (정적 파일 + /api 프록시)
  owlmon-web:
    image: owlmon-web:${OWLMON_VERSION:-latest}
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: owlmon-web
    ports:
      - "80:80"     # HTTPS로 이동만 함
      - "443:443"
    volumes:
      - ./data/certs:/etc/nginx/certs   # 기관 인증서는 여기 cert.pem·key.pem으로 (없으면 자체 서명 자동 생성)
    depends_on:
      - owlmon-server
    restart: unless-stopped

  # 일일 PostgreSQL 자동 백업 (매일 03:00 KST, 30일 rolling)
  # 백업 파일: ./data/backups/owlmon-YYYYMMDD-HHMMSS.sql.gz
  owlmon-backup:
    image: owlmon-backup:${OWLMON_VERSION:-latest}
    # 폐쇄망에선 실행 중 apk 설치가 안 되므로 openssl을 이미지에 미리 넣음
    build:
      context: ./infra
      dockerfile_inline: |
        FROM postgres:16-alpine
        RUN apk add --no-cache openssl
    container_name: owlmon-backup
    environment:
      - PGHOST=postgres
      - PGUSER=owlmon
      - PGDATABASE=owlmon
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - TZ=Asia/Seoul
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
      # 백업 암호화 (KISA AES-256-CBC + PBKDF2 100000 iter)
      # 미설정 시 컨테이너가 자동 생성 → /backups/.passphrase에 영속화 (chmod 600)
      - OWLMON_BACKUP_PASSPHRASE=${OWLMON_BACKUP_PASSPHRASE:-}
    volumes:
      - ./data/backups:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mkdir -p /backups
        chmod 700 /backups
        RETAIN=$${BACKUP_RETENTION_DAYS:-30}

        # 패스프레이즈 영속화 (JWT secret 패턴과 동일)
        PASS_FILE=/backups/.passphrase
        if [ -n "$${OWLMON_BACKUP_PASSPHRASE:-}" ]; then
          PASSPHRASE="$$OWLMON_BACKUP_PASSPHRASE"
          echo "[backup] OWLMON_BACKUP_PASSPHRASE 환경변수 사용"
        elif [ -s "$$PASS_FILE" ]; then
          PASSPHRASE=$$(cat "$$PASS_FILE")
          echo "[backup] /backups/.passphrase 영속화된 패스프레이즈 로드됨"
        else
          # 64자 random hex
          PASSPHRASE=$$(openssl rand -hex 32)
          echo "$$PASSPHRASE" > "$$PASS_FILE"
          chmod 600 "$$PASS_FILE"
          echo "[backup] 신규 패스프레이즈 생성 → /backups/.passphrase (chmod 600)"
          echo "[backup] ⚠ 이 파일을 안전한 곳에 별도 백업하세요 — 분실 시 복원 불가"
        fi

        echo "[backup] OWLmon 일일 암호화 백업 시작 (매일 03:00 KST, $$RETAIN일 보관, AES-256-CBC)"
        while true; do
          NOW_H=$$(date +%H | sed 's/^0//;s/^$$/0/')
          NOW_M=$$(date +%M | sed 's/^0//;s/^$$/0/')
          NOW_S=$$(date +%S | sed 's/^0//;s/^$$/0/')
          SECONDS_TODAY=$$(( NOW_H * 3600 + NOW_M * 60 + NOW_S ))
          TARGET=10800
          if [ "$$SECONDS_TODAY" -lt "$$TARGET" ]; then
            SLEEP_SEC=$$(( TARGET - SECONDS_TODAY ))
          else
            SLEEP_SEC=$$(( 86400 + TARGET - SECONDS_TODAY ))
          fi
          H=$$(( SLEEP_SEC / 3600 )); M=$$(( (SLEEP_SEC % 3600) / 60 ))
          echo "[backup] 다음 백업: $${H}시간 $${M}분 후"
          sleep "$$SLEEP_SEC"
          TS=$$(date +%Y%m%d-%H%M%S)
          OUT="/backups/owlmon-$${TS}.sql.gz.enc"
          echo "[backup] $$(date '+%Y-%m-%d %H:%M:%S') 암호화 백업 시작 → $$OUT"
          if pg_dump --no-owner --no-acl | gzip -9 | openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -salt -pass "pass:$$PASSPHRASE" -out "$$OUT"; then
            if [ -s "$$OUT" ]; then
              SIZE=$$(du -h "$$OUT" | awk '{print $$1}')
              echo "[backup] OK ($$SIZE, 암호화됨)"
            else
              echo "[backup] 실패 — 파일 비어있음, 삭제"
              rm -f "$$OUT"
            fi
          else
            echo "[backup] 실패 — pg_dump 또는 암호화 오류"
            rm -f "$$OUT"
          fi
          # 보관 정책 — 신규 .enc + 기존 .gz 둘 다 정리
          DELETED=$$(find /backups -type f \( -name 'owlmon-*.sql.gz' -o -name 'owlmon-*.sql.gz.enc' \) -mtime "+$$RETAIN" -print -delete 2>/dev/null | wc -l)
          if [ "$$DELETED" -gt 0 ]; then
            echo "[backup] $${RETAIN}일 초과 백업 $$DELETED개 삭제"
          fi
        done
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

