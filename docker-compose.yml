# OWLmon 통합 환경 (로컬 개발 + 단일 호스트 배포 공용)
# 사용법:
#   1) cp .env.example .env  →  비밀번호/SMTP 채우기
#   2) docker compose up -d --build
#
# 외부 노출 포트 (운영):
#   80     웹 UI (nginx)
#   4317   에이전트 OTLP (gRPC)
# 그 외(9090, 3000, 5433, 8080)는 로컬 개발 편의용으로 노출 — 운영에선 제거 가능

services:
  # 메트릭 저장소 (TSDB)
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: owlmon-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-remote-write-receiver"  # Remote Write 수신 활성화
    restart: unless-stopped

  # 대시보드 (개발 중 시각화용)
  grafana:
    image: grafana/grafana:10.4.0
    container_name: owlmon-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./data/grafana:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=owlmon
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: unless-stopped

  # OpenTelemetry Collector (에이전트 → Prometheus 중계)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: owlmon-otel-collector
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Collector 자체 메트릭
    volumes:
      - ./infra/otel/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    restart: unless-stopped

  # PostgreSQL (알림 히스토리, 사용자 관리)
  postgres:
    image: postgres:16-alpine
    container_name: owlmon-postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=owlmon
      - POSTGRES_USER=owlmon
      - POSTGRES_PASSWORD=owlmon
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owlmon -d owlmon"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # OWLmon API 서버 (Go) — server/ 디렉토리 멀티스테이지 빌드
  owlmon-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: owlmon-server
    ports:
      - "8080:8080"   # 로컬 개발 편의용 (운영에선 nginx 통해서만 접근하면 됨)
    environment:
      - OWLMON_USERNAME=${OWLMON_USERNAME:-admin}
      - OWLMON_PASSWORD_HASH=${OWLMON_PASSWORD_HASH}
      - OWLMON_PROMETHEUS_URL=http://prometheus:9090
      - OWLMON_LISTEN=:8080
      - POSTGRES_DSN=postgres://owlmon:owlmon@postgres:5432/owlmon?sslmode=disable
      - OWLMON_JWT_SECRET=${OWLMON_JWT_SECRET:-}
      # 에이전트 로그 수집 인증 키 (모든 에이전트 config.yaml의 agent_key와 일치해야 함)
      - OWLMON_AGENT_KEY=${OWLMON_AGENT_KEY:-}
      # SMTP (선택 — .env에 비워두면 알림 비활성)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_TO=${SMTP_TO:-}
    volumes:
      - ./data/owlmon-server:/app/data   # JWT secret 등 영속화
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_started
    restart: unless-stopped

  # OWLmon 웹 (정적 파일 + /api 프록시)
  owlmon-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: owlmon-web
    ports:
      - "80:80"
    depends_on:
      - owlmon-server
    restart: unless-stopped

